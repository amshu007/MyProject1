server:
  port: 9092

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ratings
    username: root1
    password: root
    driver-class-name: com.mysql.jdbc.Driver


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect


eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8080/eureka


management:
  endpoints:
    web:
      base-path: /actuator1
      exposure:
        include: health,info,metrics,env,beans

  endpoint:
    health:
      show-details: always





